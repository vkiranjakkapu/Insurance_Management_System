server:
    port: 8082
app:
    file-storage:
        base-path: ./uploads
spring:
    application:
        name: ims-documents-service
    config:
        import: configserver:http://localhost:8888
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${database.host}:${database.port}/${database.name}
        username: admin
        password: admin
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    sql:
        init:
            mode: always
